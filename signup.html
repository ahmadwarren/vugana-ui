<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Multi-Step Form</h2>
        <form id="multiStepForm">
            <div class="step active">
                <h3>Step 1</h3>
                <div class="mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" required>
                </div>
                <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" required>
                </div>
                <button type="button" class="btn btn-primary" id="nextBtn1">Next</button>
            </div>

            <div class="step">
                <h3>Step 2</h3>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" required>
                </div>
                <button type="button" class="btn btn-secondary" id="prevBtn2">Previous</button>
                <button type="button" class="btn btn-primary" id="nextBtn2">Next</button>
            </div>

            <div class="step">
                <h3>Step 3</h3>
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" required>
                </div>
                <div class="mb-3">
                    <label for="city" class="form-label">City</label>
                    <input type="text" class="form-control" id="city" required>
                </div>
                <button type="button" class="btn btn-secondary" id="prevBtn3">Previous</button>
                <button type="submit" class="btn btn-success">Submit</button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            let currentStep = 0;
            const steps = $('.step');
            
            function showStep(step) {
                steps.removeClass('active');
                steps.eq(step).addClass('active');
            }
            
            $('#nextBtn1').on('click', function() {
                currentStep++;
                showStep(currentStep);
            });
            
            $('#prevBtn2').on('click', function() {
                currentStep--;
                showStep(currentStep);
            });
            
            $('#nextBtn2').on('click', function() {
                currentStep++;
                showStep(currentStep);
            });
            
            $('#prevBtn3').on('click', function() {
                currentStep--;
                showStep(currentStep);
            });

            $('#multiStepForm').on('submit', function(e) {
                e.preventDefault();
                alert('Form submitted!');
            });
        });
    </script>
</body>
</html>
